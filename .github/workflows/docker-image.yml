name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'        # z.B. v1.2.3
    branches:
      - dev         # NEU: auch auf dev-Branch reagieren
  workflow_dispatch: {}

# Für GHCR-Login via GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: butti/sparpreis-guru
  ORG_GHCR_IMAGE: ghcr.io/sparpreis-guru/sparpreis-guru
  LEGACY_GHCR_IMAGE: ghcr.io/xlixl4snsu/sparpreis-guru

jobs:
  docker:
    if: github.ref_type == 'tag' # Nur für Tags
    runs-on: ubuntu-latest

    steps:
      # 1) Repo bereitstellen
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setze Version in package.json aus dem Tag (z.B. v1.2.3 -> 1.2.3)
      - name: Set package.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq ".version=\"$VERSION\"" package.json > package.tmp.json && mv package.tmp.json package.json

      # 3) Docker Build-Setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4) Registries Logins
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5) Tags/Labels
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.ORG_GHCR_IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=sha,format=long,prefix=sha-

      # 6) Build & Push
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to legacy GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # Classic PAT from the legacy account with write:packages.
          username: XLixl4snSU
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}

      - name: Extract legacy GHCR metadata
        id: legacy-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.LEGACY_GHCR_IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=sha,format=long,prefix=sha-

      - name: Push Docker image to legacy GHCR namespace
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.legacy-meta.outputs.tags }}
          labels: ${{ steps.legacy-meta.outputs.labels }}
          cache-from: type=gha

  docker-dev:
    if: github.ref == 'refs/heads/dev' # Nur für dev-Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:dev
            ${{ env.ORG_GHCR_IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to legacy GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # Classic PAT from the legacy account with write:packages.
          username: XLixl4snSU
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}

      - name: Push Docker image to legacy GHCR namespace (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.LEGACY_GHCR_IMAGE }}:dev
          cache-from: type=gha
